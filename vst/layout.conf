# Ondes: hand layout (browser renderer, "art": "html" in vst.json). Plugin area 1280 x 628 at y=90..718.
# Big text: skin.css sets the baked sizes; label_scale/scale_names the live names and values MPC draws.
# Group labels are text lines (a baked label's centre sits ~14 px below its cy), not enum labels, which assume 33 px segments.
art_css=skin.css
label_scale=1.3
scale_names=1
theme_bg=15110d
theme_panel=1f1914
theme_line=4a3d30
theme_ink=f3ead8
theme_ink_dim=c2b398
theme_ink_faint=7d705c
theme_accent=d98e2b
theme_accent_hi=f2b24c
theme_knob_face=efe6d2
theme_knob_ring=3a3027
theme_knob_dot=b8461f
theme_seg_active=f2b24c
theme_seg_inactive=2b231c
theme_seg_active_tx=1a140f
theme_box=241d17
theme_btn_on=f2b24c

[tab SOUND]
frame x=20 y=90 w=1240 h=300 title="TIMBRES — TAP TO COMBINE"
button cx=172 cy=196 w=290 h=104 label="O  SINE" key=t_o color=2b231c
button cx=482 cy=196 w=290 h=104 label="8  OCTAVE" key=t_8 color=2b231c
button cx=792 cy=196 w=290 h=104 label="C  HOLLOW" key=t_c color=2b231c
button cx=1102 cy=196 w=290 h=104 label="G  SQUARE" key=t_g color=2b231c
button cx=172 cy=318 w=290 h=104 label="g  SOFT SQUARE" key=t_gp color=2b231c
button cx=482 cy=318 w=290 h=104 label="N  NASAL" key=t_n color=2b231c
button cx=792 cy=318 w=290 h=104 label="S  BREATH" key=t_s color=2b231c
button cx=1102 cy=318 w=290 h=104 label="T  ALL" key=t_t color=2b231c
frame x=20 y=402 w=1240 h=310 title="SHAPE AND TONE"
knob cx=98 cy=540 r=48 key=oct_level bw=150
knob cx=253 cy=540 r=48 key=g_level bw=150
knob cx=408 cy=540 r=48 key=souffle_bal bw=150
knob cx=563 cy=540 r=48 key=grave bw=150
knob cx=718 cy=540 r=48 key=aigu bw=150
knob cx=873 cy=540 r=48 key=drive bw=150
knob cx=1028 cy=540 r=48 key=volume bw=150
button cx=1183 cy=556 w=140 h=130 label="MUFFLE" key=felt color=2b231c
qlinks "SOUND" = volume,souffle_bal,oct_level,g_level,grave,aigu,drive,felt

[tab PLAY]
frame x=20 y=90 w=760 h=300 title="PLAY MODE"
enum_h cx=210 cy=162 sw=170 sh=60 key=mode
text cx=210 cy=206 label="VOICES" size=1.9 color=c2b398
enum_h cx=210 cy=258 sw=113 sh=52 key=voice_mode
text cx=210 cy=294 label="STRIP NOTES UP" size=1.9 color=c2b398
enum_h cx=210 cy=346 sw=84 sh=48 key=strip_notes
knob cx=500 cy=220 r=46 key=glide_ms bw=150 when=mode:Keyboard
knob cx=670 cy=220 r=46 key=bend_range bw=150 when=mode:Keyboard
text cx=585 cy=128 label="RIBBON RANGE" size=1.9 color=c2b398 when=mode:Ribbon
enum_h cx=585 cy=196 sw=88 sh=66 key=ring_span when=mode:Ribbon
button cx=585 cy=316 w=360 h=76 label="HOLD WHERE LEFT" key=ring_latch color=2b231c when=mode:Ribbon
frame x=800 y=90 w=460 h=300 title="PITCH"
text cx=1030 cy=128 label="OCTAVE" size=1.9 color=c2b398
enum_h cx=1030 cy=184 sw=130 sh=62 key=octave
knob cx=940 cy=270 r=34 key=tune bw=160
knob cx=1120 cy=270 r=34 key=ring_slew_ms bw=160
frame x=20 y=402 w=1240 h=310 title="TRANSPOSE — BUTTONS ADD UP"
button cx=123 cy=540 w=190 h=150 label="-1/4" key=tr_m14 color=2b231c
button cx=329 cy=540 w=190 h=150 label="+1/4" key=tr_p14 color=2b231c
button cx=535 cy=540 w=190 h=150 label="+1/2" key=tr_p12 color=2b231c
button cx=741 cy=540 w=190 h=150 label="+1 TONE" key=tr_p1 color=2b231c
button cx=947 cy=540 w=190 h=150 label="+3RD" key=tr_p3 color=2b231c
button cx=1153 cy=540 w=190 h=150 label="+5TH" key=tr_p5 color=2b231c
text cx=640 cy=652 label="QUARTER TONE · HALF TONE · WHOLE TONE · MAJOR THIRD · FIFTH" size=1.8 color=c2b398
qlinks "PLAY" = glide_ms,bend_range,tune,ring_slew_ms,mode,voice_mode,octave,ring_span,ring_latch,strip_notes

[tab EXPRESSION]
